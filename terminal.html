<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CITY WILL TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050b14;
      color: #3fe0f0;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: rgba(10, 30, 45, 0.85);
      border: 2px solid #3fe0f0;
      padding: 25px 40px;
      box-shadow: 0 0 15px rgba(63, 224, 240, 0.4);
    }
    #prescript {
      font-size: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="prescript">WAITING</div>
  </div>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host);

    ws.onmessage = (event) => {
      // 입력받은 지령 텍스트를 기호 없이 대문자 도트 폰트로 즉시 변경
      document.getElementById('prescript').innerText = event.data.trim().toUpperCase();
    };
  </script>
</body>
</html>
