<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CITY WILL TERMINAL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    body {
      background-color: #050b14;
      color: #3fe0f0;
      font-family: 'Galmuri9', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .box {
      background: rgba(10, 30, 45, 0.85);
      border: 2px solid #3fe0f0;
      padding: 25px 40px;
      box-shadow: 0 0 15px rgba(63, 224, 240, 0.4);
      text-align: center;
      cursor: pointer;
    }
    #prescript {
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: bold;
      min-height: 40px;
    }
    .sub-text {
      font-size: 14px;
      margin-bottom: 15px;
      color: #88c0d0;
    }
    #audio-notice {
      font-size: 11px;
      color: #ff5555;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box" id="terminal-box">
    <div class="sub-text">[ CITY WILL PRESCRIPT RECEIVER ]</div>
    <div id="prescript">지령 대기 중</div>
    <div id="audio-notice">▲ 화면을 클릭하여 효과음을 활성화하세요 ▲</div>
  </div>

  <audio id="limbus-sound" src="alarm.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('limbus-sound');
    const prescriptEl = document.getElementById('prescript');
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%#$@&*!';
    let scrambleInterval = null;

    function initAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        document.getElementById('audio-notice').style.display = 'none';
      }).catch(() => {});
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    // 림버스 특유의 글자 섞이며 고정되는 스크램블 연출 함수
    function startTextScramble(targetText) {
      if (scrambleInterval) clearInterval(scrambleInterval);

      let step = 0;
      const length = targetText.length;

      scrambleInterval = setInterval(() => {
        let output = '';

        for (let i = 0; i < length; i++) {
          if (i < Math.floor(step)) {
            // 이미 해독 완료된 글자 (목표 글자 고정)
            output += targetText[i];
          } else {
            // 아직 해독 중인 글자 (랜덤 기호 섞임)
            output += chars[Math.floor(Math.random() * chars.length)];
          }
        }

        prescriptEl.innerText = output;
        step += 0.35; // 타자속도 조절 (숫자가 작을수록천천히 해독)

        if (step >= length + 1) {
          prescriptEl.innerText = targetText;
          clearInterval(scrambleInterval);
        }
      }, 40); // 40ms 간격으로 무작위 프레임 갱신
    }

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host);

    ws.onmessage = (event) => {
      const receivedText = event.data.trim();
      
      // 1. MP3 사운드 재생
      audio.currentTime = 0;
      audio.play().catch(() => {});

      // 2. 글자 섞이는 해독 연출 시작
      startTextScramble(receivedText);
    };
  </script>
</body>
</html>
