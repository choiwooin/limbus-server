<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .terminal-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .terminal-header {
            background-color: #21262d;
            padding: 10px 15px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
        }
        .buttons {
            display: flex;
            gap: 8px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }
        .title {
            color: #8b949e;
            font-size: 14px;
            margin-left: 15px;
        }
        .terminal-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            color: #c9d1d9;
            font-size: 16px;
            line-height: 1.6;
        }
        .prompt {
            color: #2f81f7;
            font-weight: bold;
        }
        .output {
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            flex-grow: 1;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="terminal-header">
        <div class="buttons">
            <div class="btn close"></div>
            <div class="btn minimize"></div>
            <div class="btn maximize"></div>
        </div>
        <div class="title">bash - terminal</div>
    </div>
    
    <div class="terminal-body" id="terminal-body">
        <div class="output"><span class="prompt">system@device:~$</span> Terminal Ready.</div>
        <div class="input-line">
            <span class="prompt">system@device:~$</span>
            <input type="text" id="command-input" autofocus>
        </div>
    </div>
</div>

<script>
    const input = document.getElementById('command-input');
    const body = document.getElementById('terminal-body');

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const cmd = this.value;
            if (cmd.trim() !== '') {
                const newOutput = document.createElement('div');
                newOutput.className = 'output';
                newOutput.innerHTML = `<span class="prompt">system@device:~$</span> ${cmd}`;
                
                body.insertBefore(newOutput, input.parentElement);
                this.value = '';
                body.scrollTop = body.scrollHeight;
            }
        }
    });
</script>

</body>
</html>
