<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CITY WILL TERMINAL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    body {
      background-color: #050b14;
      color: #3fe0f0;
      font-family: 'Galmuri9', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: rgba(10, 30, 45, 0.85);
      border: 2px solid #3fe0f0;
      padding: 25px 40px;
      box-shadow: 0 0 15px rgba(63, 224, 240, 0.4);
      text-align: center;
    }
    #prescript {
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: bold;
    }
    .sub-text {
      font-size: 14px;
      margin-bottom: 15px;
      color: #88c0d0;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="sub-text">[ CITY WILL PRESCRIPT RECEIVER ]</div>
    <div id="prescript">지령 대기 중</div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 림버스 특유의 중저음 3연속 레트로 경고음 (삐- 삐- 삐-)
    function playLimbusAlarm() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const freqs = [520, 520, 520]; // 묵직한 520Hz 중저음 톤
      const times = [0, 0.15, 0.30];

      freqs.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth'; // 톱니바퀴형 파형 (둔탁하고 기계적인 음색)
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          // 묵직한 타격감 후 여운이 살짝 남는 볼륨 조절
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 0.12);
        }, times[idx] * 1000);
      });
    }

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host);

    ws.onmessage = (event) => {
      document.getElementById('prescript').innerText = event.data.trim();
      playLimbusAlarm();
    };

    window.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    });
  </script>
</body>
</html>
