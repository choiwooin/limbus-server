<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CITY WILL TERMINAL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    body {
      background-color: #050b14;
      color: #3fe0f0;
      font-family: 'Galmuri9', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }
    .box {
      background: rgba(10, 30, 45, 0.85);
      border: 2px solid #3fe0f0;
      padding: 25px 40px;
      box-shadow: 0 0 15px rgba(63, 224, 240, 0.4);
      text-align: center;
      cursor: pointer;
    }
    #prescript {
      font-size: 32px;
      letter-spacing: 2px;
      font-weight: bold;
    }
    .sub-text {
      font-size: 14px;
      margin-bottom: 15px;
      color: #88c0d0;
    }
    #audio-notice {
      font-size: 11px;
      color: #ff5555;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box" id="terminal-box">
    <div class="sub-text">[ CITY WILL PRESCRIPT RECEIVER ]</div>
    <div id="prescript">지령 대기 중</div>
    <div id="audio-notice">▲ 화면을 클릭하여 효과음을 활성화하세요 ▲</div>
  </div>

  <!-- 올리신 MP3 파일 연결 -->
  <audio id="limbus-sound" src="index_message (1).mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('limbus-sound');

    // 화면 클릭 시 브라우저 오디오 차단 해제
    function initAudio() {
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        document.getElementById('audio-notice').style.display = 'none';
      }).catch(() => {});
    }

    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host);

    ws.onmessage = (event) => {
      document.getElementById('prescript').innerText = event.data.trim();
      
      // 원작 MP3 소리 재생
      audio.currentTime = 0;
      audio.play();
    };
  </script>
</body>
</html>
