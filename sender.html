<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CITY WILL - SENDER</title>
  <style>
    body { background: #050b14; color: #3fe0f0; font-family: monospace; text-align: center; padding-top: 50px; }
    input { padding: 10px; width: 250px; background: #112233; color: #fff; border: 1px solid #3fe0f0; }
    button { padding: 10px 20px; background: #3fe0f0; color: #000; font-weight: bold; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>[ CITY WILL PRESCRIPT SENDER ]</h2>
  <br>
  <input type="text" id="msg" placeholder="지령 입력 (예: CLEAR)">
  <button onclick="send()">전송</button>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(protocol + '//' + location.host);

    function send() {
      const input = document.getElementById('msg');
      if (input.value && ws.readyState === WebSocket.OPEN) {
        ws.send(input.value);
        alert('지령 하달: ' + input.value);
        input.value = '';
      } else {
        alert('서버와 연결 중입니다. 잠시 후 다시 시도하세요.');
      }
    }
  </script>
</body>
</html>
